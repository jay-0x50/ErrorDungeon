server {
    listen 80;
    listen [::]:80;
    server_name error-dungeon.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name error-dungeon.local;

    ssl_certificate /etc/ssl/error-dungeon/error-dungeon.crt;
    ssl_certificate_key /etc/ssl/error-dungeon/error-dungeon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ErrorDungeonSSL:10m;

    access_log /var/log/nginx/error-dungeon.access.log;
    error_log /var/log/nginx/error-dungeon.error.log warn;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}

